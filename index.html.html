<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Eco-Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F2F5EC;
    --paper: #FFFFFF;
    --ink: #22281D;
    --ink-soft: #5B6455;
    --forest: #24462B;
    --leaf: #6FA35A;
    --leaf-soft: #E4EEDC;
    --amber: #E2A33B;
    --amber-soft: #FBEEDA;
    --line: #DEE5D3;
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#DCE3D2; font-family:'Manrope',sans-serif; color:var(--ink);
    display:flex; justify-content:center; min-height:100vh;
  }
  #phone{
    width:100%; max-width:420px; min-height:100vh; background:var(--bg);
    position:relative; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,0.25);
  }
  header.top{
    padding:20px 20px 14px; background:var(--forest); color:#fff;
    border-radius:0 0 22px 22px;
  }
  .top-row{display:flex; justify-content:space-between; align-items:flex-start;}
  .brand{display:flex; align-items:center; gap:8px;}
  .brand svg{width:26px;height:26px;}
  .brand-name{font-family:'Fraunces',serif; font-size:19px; font-weight:600; letter-spacing:0.2px;}
  .role-toggle{
    display:flex; background:rgba(255,255,255,0.14); border-radius:999px; padding:3px; font-size:12px; font-weight:600;
  }
  .role-toggle button{
    border:none; background:transparent; color:#fff; opacity:0.65; padding:6px 12px; border-radius:999px; cursor:pointer;
    font-family:'Manrope',sans-serif; font-size:12px; font-weight:700;
  }
  .role-toggle button.active{background:#fff; color:var(--forest); opacity:1;}
  .greeting{margin-top:16px;}
  .greeting .hi{font-size:13px; opacity:0.75;}
  .greeting .name{font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin-top:2px;}
  .points-pill{
    margin-top:14px; display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.22); border-radius:14px; padding:10px 14px;
  }
  .points-pill .label{font-size:11px; opacity:0.75;}
  .points-pill .val{font-size:17px; font-weight:800; margin-top:1px;}

  main{flex:1; overflow-y:auto; padding:18px 18px 90px;}
  .section-title{font-size:14px; font-weight:800; margin:6px 0 10px; display:flex; align-items:center; justify-content:space-between;}
  .section-title span.link{font-size:12px; color:var(--leaf); font-weight:700; cursor:pointer;}

  .quick-actions{display:flex; gap:10px; margin-bottom:22px;}
  .qa-btn{
    flex:1; background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:14px 10px;
    display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; text-align:center;
  }
  .qa-btn .icon{
    width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  }
  .qa-btn span{font-size:11.5px; font-weight:700; color:var(--ink);}

  .bin-card{
    background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:13px 14px; margin-bottom:10px;
    display:flex; align-items:center; gap:12px;
  }
  .bin-icon{width:40px;height:40px;border-radius:11px;background:var(--leaf-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .bin-info{flex:1; min-width:0;}
  .bin-name{font-size:13.5px; font-weight:700;}
  .bin-loc{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
  .bar-track{height:6px; background:#EDF1E6; border-radius:99px; margin-top:7px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px;}
  .bin-pct{font-size:12px; font-weight:800; margin-left:4px; white-space:nowrap;}
  .badge{font-size:9.5px; font-weight:800; padding:3px 7px; border-radius:99px; margin-top:6px; display:inline-block;}
  .badge-full{background:#FBE4DF; color:#B14A34;}
  .badge-ok{background:var(--leaf-soft); color:var(--forest);}

  .card{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px;}
  .flow-label{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px; font-weight:700; margin-bottom:6px;}

  .type-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .type-card{border:1.5px solid var(--line); border-radius:14px; padding:14px 10px; text-align:center; cursor:pointer; background:var(--paper);}
  .type-card.selected{border-color:var(--leaf); background:var(--leaf-soft);}
  .type-card .emoji{font-size:22px;}
  .type-card .lbl{font-size:12px; font-weight:700; margin-top:6px;}

  .field{margin-bottom:14px;}
  .field label{font-size:11.5px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:6px;}
  .field .value-box{
    background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:11px 13px; font-size:13.5px; font-weight:600;
  }
  .slot-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .slot{border:1.5px solid var(--line); border-radius:11px; padding:9px; text-align:center; font-size:12.5px; font-weight:700; cursor:pointer; background:var(--paper);}
  .slot.selected{background:var(--forest); color:#fff; border-color:var(--forest);}

  .btn-primary{
    width:100%; background:var(--forest); color:#fff; border:none; border-radius:13px; padding:14px; font-size:14.5px;
    font-weight:800; cursor:pointer; font-family:'Manrope',sans-serif; margin-top:6px;
  }
  .btn-secondary{
    width:100%; background:var(--paper); color:var(--forest); border:1.5px solid var(--forest); border-radius:13px; padding:13px;
    font-size:14px; font-weight:800; cursor:pointer; font-family:'Manrope',sans-serif; margin-top:8px;
  }

  .confirm-wrap{text-align:center; padding:20px 6px;}
  .confirm-wrap .tick{width:62px;height:62px;border-radius:50%;background:var(--leaf-soft); display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .agent-card{display:flex; align-items:center; gap:12px; background:var(--amber-soft); border-radius:14px; padding:12px 14px; margin-top:14px; text-align:left;}
  .agent-avatar{width:42px;height:42px;border-radius:50%;background:var(--amber); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:800; flex-shrink:0;}

  .product-card{background:var(--paper); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:14px;}
  .product-img{height:110px; display:flex; align-items:center; justify-content:center; font-size:36px;}
  .product-body{padding:12px 14px;}
  .product-title{font-size:13.5px; font-weight:700;}
  .product-maker{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .product-row{display:flex; justify-content:space-between; align-items:center; margin-top:9px;}
  .product-price{font-size:14.5px; font-weight:800;}
  .buy-btn{background:var(--forest); color:#fff; border:none; border-radius:9px; padding:7px 13px; font-size:11.5px; font-weight:800; cursor:pointer;}

  .coupon{border:1.5px dashed var(--leaf); background:var(--leaf-soft); border-radius:13px; padding:12px 14px; text-align:center; margin-top:14px;}
  .coupon .code{font-size:17px; font-weight:800; letter-spacing:1.5px; color:var(--forest); margin-top:3px;}

  .reward-card{background:linear-gradient(135deg,#2C4F32,#1B331F); color:#fff; border-radius:18px; padding:20px; margin-bottom:16px;}
  .reward-card .big{font-size:32px; font-weight:800; margin-top:4px;}
  .reward-card .sub{font-size:11.5px; opacity:0.8;}
  .redeem-row{display:flex; justify-content:space-between; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px;}
  .redeem-row .rl{font-size:13px; font-weight:700;}
  .redeem-row .rp{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .redeem-btn{border:1.5px solid var(--forest); color:var(--forest); background:transparent; border-radius:9px; padding:6px 12px; font-size:11.5px; font-weight:800; cursor:pointer;}
  .redeem-btn:disabled{opacity:0.35; border-color:var(--ink-soft); color:var(--ink-soft); cursor:not-allowed;}

  .bid-card{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:13px 14px; margin-bottom:12px;}
  .bid-top{display:flex; justify-content:space-between; align-items:center;}
  .bid-amt-row{display:flex; gap:8px; margin-top:10px;}
  .bid-amt-row input{flex:1; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13px; font-family:'Manrope',sans-serif;}
  .bid-amt-row button{background:var(--amber); border:none; border-radius:10px; padding:9px 14px; font-weight:800; font-size:12px; color:#3B2A0E; cursor:pointer;}

  nav.tabbar{
    position:absolute; bottom:0; left:0; right:0; background:var(--paper); border-top:1px solid var(--line);
    display:flex; padding:8px 6px 12px; max-width:420px; margin:0 auto;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-soft); cursor:pointer; font-family:'Manrope',sans-serif; padding:6px 2px;
  }
  nav.tabbar button.active{color:var(--forest);}
  nav.tabbar span{font-size:10px; font-weight:700;}

  .empty-note{font-size:11.5px; color:var(--ink-soft); text-align:center; padding:10px 4px 2px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="phone">

  <header class="top">
    <div class="top-row">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C7 2 3 6 3 11c0 5 4.5 9 9 11 4.5-2 9-6 9-11 0-5-4-9-9-9Z" fill="#6FA35A"/><path d="M12 6c-2.5 1-4 3.2-4 6" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span class="brand-name">Eco-Loop</span>
      </div>
      <div class="role-toggle">
        <button id="roleDonatorBtn" class="active" onclick="setRole('donator')">Donator</button>
        <button id="roleReceiverBtn" onclick="setRole('receiver')">Receiver</button>
      </div>
    </div>
    <div class="greeting">
      <div class="hi">Good afternoon,</div>
      <div class="name" id="greetName">Aditi</div>
    </div>
    <div class="points-pill">
      <div>
        <div class="label" id="pillLabel">Green Points</div>
        <div class="val" id="pillVal">320 pts</div>
      </div>
      <div style="text-align:right;">
        <div class="label">Pune, MH</div>
        <div class="val" style="font-size:12px;">Kothrud area</div>
      </div>
    </div>
  </header>

  <main id="mainArea"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="home" onclick="setTab('home')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4l8 7M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-tab="pickup" onclick="setTab('pickup')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7h11l4 4v6h-2M4 7v10h2M4 7l1.5-3h6L13 7M9 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm9 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="tabPickupLabel">Pickup</span>
    </button>
    <button class="tab" data-tab="market" onclick="setTab('market')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 8h16l-1.5 10.5a1 1 0 0 1-1 .5H6.5a1 1 0 0 1-1-.5L4 8Zm4 0V6a4 4 0 0 1 8 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Market</span>
    </button>
    <button class="tab" data-tab="rewards" onclick="setTab('rewards')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0 0v13M5 11l7-3 7 3-1.5 8.5a1 1 0 0 1-1 .8H7.5a1 1 0 0 1-1-.8L5 11Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="tabRewardsLabel">Rewards</span>
    </button>
  </nav>
</div>

<script>
let role = 'donator';
let tab = 'home';
let points = 320;
let pickupStep = 1;
let selectedType = null;
let selectedSlot = null;

const bins = [
  {name:"Fergusson College", loc:"Shivajinagar", pct:82, tag:"college"},
  {name:"Ruby Hall Clinic", loc:"Sangamwadi", pct:45, tag:"hospital"},
  {name:"Phoenix Marketcity", loc:"Viman Nagar", pct:96, tag:"mall"},
  {name:"Hyatt Pune", loc:"Kalyani Nagar", pct:31, tag:"hotel"},
  {name:"Persistent Systems Campus", loc:"Hinjewadi Phase 1", pct:60, tag:"office"},
];

const products = [
  {emoji:"👜", title:"Recycled Plastic Tote Bag", maker:"GreenThread Recyclers · Wagholi", price:249, bg:"#E4EEDC"},
  {emoji:"📓", title:"Recycled Paper Notebook Set", maker:"Kagaz Punarnirman · Kothrud", price:149, bg:"#FBEEDA"},
  {emoji:"🌱", title:"Bio-Fertilizer Compost 5kg", maker:"Mulching Pune Bio-Waste Plant · Wagholi", price:199, bg:"#E4EEDC"},
  {emoji:"🪑", title:"Recycled Plastic Garden Chair", maker:"Plastic2Product · Chakan", price:899, bg:"#FBEEDA"},
];

const bulkRequests = [
  {type:"Mixed Dry Scrap", qty:"40 kg", area:"Baner", myBid:null},
  {type:"E-Waste (circuit boards)", qty:"12 kg", area:"Hinjewadi", myBid:null},
  {type:"Cardboard & Paper", qty:"75 kg", area:"Kothrud", myBid:null},
];

function pct(el){ return el; }

function binBarColor(p){
  if(p>=85) return '#C0553D';
  if(p>=60) return '#E2A33B';
  return '#6FA35A';
}

function setRole(r){
  role = r;
  document.getElementById('roleDonatorBtn').classList.toggle('active', r==='donator');
  document.getElementById('roleReceiverBtn').classList.toggle('active', r==='receiver');
  document.getElementById('pillLabel').textContent = r==='donator' ? 'Green Points' : 'This month, sold';
  document.getElementById('pillVal').textContent = r==='donator' ? points + ' pts' : '₹8,450';
  document.getElementById('tabPickupLabel').textContent = r==='donator' ? 'Pickup' : 'Requests';
  document.getElementById('tabRewardsLabel').textContent = r==='donator' ? 'Rewards' : 'Listings';
  tab = 'home'; pickupStep = 1;
  render();
}

function setTab(t){
  tab = t;
  if(t==='pickup') pickupStep = 1;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  render();
}

function render(){
  const main = document.getElementById('mainArea');
  if(role==='donator'){
    if(tab==='home') main.innerHTML = donatorHome();
    else if(tab==='pickup') main.innerHTML = donatorPickup();
    else if(tab==='market') main.innerHTML = marketView(true);
    else if(tab==='rewards') main.innerHTML = donatorRewards();
  } else {
    if(tab==='home') main.innerHTML = receiverHome();
    else if(tab==='pickup') main.innerHTML = receiverRequests();
    else if(tab==='market') main.innerHTML = marketView(false);
    else if(tab==='rewards') main.innerHTML = receiverListings();
  }
  attachHandlers();
}

function donatorHome(){
  return `
    <div class="quick-actions">
      <div class="qa-btn" onclick="setTab('pickup')">
        <div class="icon" style="background:var(--leaf-soft);">🚛</div>
        <span>Request Pickup</span>
      </div>
      <div class="qa-btn" onclick="setTab('market')">
        <div class="icon" style="background:var(--amber-soft);">🛍️</div>
        <span>Shop Recycled</span>
      </div>
      <div class="qa-btn" onclick="setTab('rewards')">
        <div class="icon" style="background:var(--leaf-soft);">🎟️</div>
        <span>Redeem Points</span>
      </div>
    </div>
    <div class="section-title">Smart bins near you <span class="link" onclick="alert('Showing all bins in Pune district')">See all</span></div>
    ${bins.map(b=>`
      <div class="bin-card">
        <div class="bin-icon">🗑️</div>
        <div class="bin-info">
          <div class="bin-name">${b.name}</div>
          <div class="bin-loc">${b.loc}, Pune</div>
          <div class="bar-track"><div class="bar-fill" style="width:${b.pct}%; background:${binBarColor(b.pct)}"></div></div>
          ${b.pct>=90 ? `<span class="badge badge-full">Full — pickup auto-requested</span>` : `<span class="badge badge-ok">Collecting</span>`}
        </div>
        <div class="bin-pct" style="color:${binBarColor(b.pct)}">${b.pct}%</div>
      </div>
    `).join('')}
  `;
}

function donatorPickup(){
  if(pickupStep===1){
    return `
      <div class="flow-label">Step 1 of 3 · What are you donating?</div>
      <div class="type-grid">
        ${["Dry Recyclable ♻️","Wet Compostable 🍃","E-Waste 🔌","Bulk Scrap 📦"].map((t,i)=>{
          const [lbl, emoji] = [t.split(' ').slice(0,-1).join(' '), t.split(' ').slice(-1)[0]];
          return `<div class="type-card ${selectedType===i?'selected':''}" onclick="selectType(${i})">
            <div class="emoji">${emoji}</div><div class="lbl">${lbl}</div>
          </div>`;
        }).join('')}
      </div>
      <button class="btn-primary" ${selectedType===null?'disabled style="opacity:0.4;"':''} onclick="pickupStep=2;render()">Continue</button>
    `;
  }
  if(pickupStep===2){
    return `
      <div class="flow-label">Step 2 of 3 · Pickup details</div>
      <div class="field">
        <label>Pickup address</label>
        <div class="value-box">12, Karve Nagar, Pune — 411052</div>
      </div>
      <div class="field">
        <label>Choose a time slot — Tomorrow</label>
        <div class="slot-grid">
          ${["9–10 AM","11–12 PM","2–3 PM","4–5 PM"].map((s,i)=>`
            <div class="slot ${selectedSlot===i?'selected':''}" onclick="selectSlot(${i})">${s}</div>
          `).join('')}
        </div>
      </div>
      <button class="btn-primary" ${selectedSlot===null?'disabled style="opacity:0.4;"':''} onclick="pickupStep=3;render()">Confirm pickup</button>
      <button class="btn-secondary" onclick="pickupStep=1;render()">Back</button>
    `;
  }
  return `
    <div class="card confirm-wrap">
      <div class="tick">✅</div>
      <div style="font-weight:800; font-size:15px;">Pickup confirmed</div>
      <div style="font-size:12.5px; color:var(--ink-soft); margin-top:4px;">You'll earn ~40 green points once collected</div>
      <div class="agent-card">
        <div class="agent-avatar">RK</div>
        <div>
          <div style="font-weight:800; font-size:13px;">Ramesh K.</div>
          <div style="font-size:11.5px; color:var(--ink-soft);">Verified agent · E-scooter · Arriving tomorrow, 11–12 PM</div>
        </div>
      </div>
      <button class="btn-secondary" onclick="pickupStep=1; selectedType=null; selectedSlot=null; setTab('home')">Done</button>
    </div>
  `;
}

function marketView(isDonator){
  return `
    <div class="section-title">Shop from recyclers in Pune</div>
    ${products.map((p,i)=>`
      <div class="product-card">
        <div class="product-img" style="background:${p.bg}">${p.emoji}</div>
        <div class="product-body">
          <div class="product-title">${p.title}</div>
          <div class="product-maker">${p.maker}</div>
          <div class="product-row">
            <div class="product-price">₹${p.price}</div>
            <button class="buy-btn" onclick="buyProduct(${i}, ${isDonator})">Buy</button>
          </div>
        </div>
      </div>
    `).join('')}
    <div class="empty-note">Prices shown are sample data for this district preview.</div>
  `;
}

function buyProduct(i, isDonator){
  const code = "ECO" + (10 + i * 5);
  const main = document.getElementById('mainArea');
  main.innerHTML = `
    <div class="card confirm-wrap">
      <div class="tick">🎉</div>
      <div style="font-weight:800; font-size:15px;">Order placed</div>
      <div style="font-size:12.5px; color:var(--ink-soft); margin-top:4px;">${products[i].title}</div>
      <div class="coupon">
        <div style="font-size:11.5px; font-weight:700; color:var(--forest);">Your discount coupon</div>
        <div class="code">${code}</div>
        <div style="font-size:11px; color:var(--ink-soft); margin-top:3px;">15% off your next Eco-Loop purchase</div>
      </div>
      <button class="btn-secondary" onclick="setTab('market')">Continue shopping</button>
    </div>
  `;
}

function donatorRewards(){
  return `
    <div class="reward-card">
      <div class="sub">Your balance</div>
      <div class="big">${points} pts</div>
      <div class="sub" style="margin-top:6px;">Earned from ${Math.round(points/8)} kg donated this year</div>
    </div>
    <div class="section-title">Redeem</div>
    ${[
      {name:"₹50 shopping coupon", cost:150},
      {name:"₹100 shopping coupon", cost:280},
      {name:"Volunteer event pass — Riverside Cleanup", cost:100},
    ].map(r=>`
      <div class="redeem-row">
        <div>
          <div class="rl">${r.name}</div>
          <div class="rp">${r.cost} pts</div>
        </div>
        <button class="redeem-btn" ${points<r.cost?'disabled':''} onclick="redeem(${r.cost})">Redeem</button>
      </div>
    `).join('')}
  `;
}

function redeem(cost){
  points -= cost;
  document.getElementById('pillVal').textContent = points + ' pts';
  render();
}

function receiverHome(){
  return `
    <div class="quick-actions">
      <div class="qa-btn" onclick="setTab('pickup')">
        <div class="icon" style="background:var(--leaf-soft);">📥</div>
        <span>Waste Requests</span>
      </div>
      <div class="qa-btn" onclick="setTab('rewards')">
        <div class="icon" style="background:var(--amber-soft);">📦</div>
        <span>My Listings</span>
      </div>
      <div class="qa-btn" onclick="setTab('market')">
        <div class="icon" style="background:var(--leaf-soft);">🏪</div>
        <span>Marketplace</span>
      </div>
    </div>
    <div class="section-title">Bulk scrap available to bid on</div>
    ${bulkRequests.map((b,i)=>`
      <div class="bid-card">
        <div class="bid-top">
          <div>
            <div style="font-weight:700; font-size:13px;">${b.type}</div>
            <div style="font-size:11.5px; color:var(--ink-soft);">${b.qty} · ${b.area}, Pune</div>
          </div>
          <span class="badge badge-ok">Open</span>
        </div>
      </div>
    `).join('')}
  `;
}

function receiverRequests(){
  return `
    <div class="flow-label">Bid for bulk scrap near you</div>
    ${bulkRequests.map((b,i)=>`
      <div class="bid-card">
        <div class="bid-top">
          <div>
            <div style="font-weight:700; font-size:13px;">${b.type}</div>
            <div style="font-size:11.5px; color:var(--ink-soft);">${b.qty} · ${b.area}, Pune</div>
          </div>
        </div>
        <div class="bid-amt-row">
          <input type="number" placeholder="Your price (₹/kg)" id="bidInput${i}">
          <button onclick="placeBid(${i})">Place bid</button>
        </div>
        ${b.myBid ? `<div style="font-size:11.5px; color:var(--forest); font-weight:700; margin-top:8px;">Your bid: ₹${b.myBid}/kg submitted</div>` : ''}
      </div>
    `).join('')}
  `;
}

function placeBid(i){
  const val = document.getElementById('bidInput'+i).value;
  if(!val) return;
  bulkRequests[i].myBid = val;
  render();
}

function receiverListings(){
  return `
    <div class="flow-label">Your listed recycled products</div>
    ${products.slice(0,2).map(p=>`
      <div class="product-card">
        <div class="product-img" style="background:${p.bg}">${p.emoji}</div>
        <div class="product-body">
          <div class="product-title">${p.title}</div>
          <div class="product-maker">Listed for sale · Active</div>
          <div class="product-row">
            <div class="product-price">₹${p.price}</div>
            <span class="badge badge-ok">Live on Marketplace</span>
          </div>
        </div>
      </div>
    `).join('')}
    <button class="btn-secondary" onclick="alert('Opens a form to list a new recycled product')">+ List new product</button>
  `;
}

function selectType(i){ selectedType = i; render(); }
function selectSlot(i){ selectedSlot = i; render(); }
function attachHandlers(){}

render();
</script>
